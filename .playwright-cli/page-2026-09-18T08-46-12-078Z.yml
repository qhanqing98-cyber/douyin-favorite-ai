                  - generic [ref=e115]:
                    - text: 收藏里关于“为什么会焦虑”的解释，可以归纳为几个核心原因： 1. 焦虑的共性是“怕” 来自「小僵尸谈哲理」的视频：所有焦虑的人都有一个共性——怕。怕丢脸、怕失败、怕改变。你越怕，生活扑面而来的麻烦反而越多。你会不停在脑海里预演最糟糕的可能性：还没上台就想象自己大脑空白、被嘲笑；还没面试就想象被问得哑口无言、被扫地出门；还没表白就想象被拒绝、沦为笑柄。 2. 本质是对不确定性的恐惧 + 灾难化思维 同一条视频指出：焦虑的本质是你对不确定性有着深重而畸形的恐惧。大脑自动开启“灾难化思维模式”，永远悲观地预设最坏结果。这种思维把你拖进恶性循环：越怕越心虚，越心虚越恐惧，最后错失机会。 3. 预期性焦虑：事情还没开始，就提前承受失败痛苦 来自「江东陵」的视频：困住人的往往不是能力，而是那些还没发生的事。心理学称之为“预期性焦虑”，特点是事情还没开始，你却已经提前承受了失败带来的痛苦。大脑天生喜欢预测未来且优先预测危险，你反复设想最坏结果，大脑就把它当成真实威胁，让你心跳加快、手心冒汗、不断犹豫——你不是输给了现实，而是输给了自己的想象。 4. 追求“最优解”的执念 来自「二百吴同学」的视频：特别容易焦虑的人都有一个执念——做任何事都要追求最优解，一步弯路都不想走。于是哪个选项都不满意，过程中一有波动就反复美化那条没选的路，结果不符合预期又用结局倒推、攻击当初的自己，越来越害怕选择。 5. 边做边怀疑，想规避一切错误 来自「润风心理成长」的视频：一边行动一边质疑（“这样看书真的有用吗”“这关系对吗”）是一种预期性焦虑，目的是避开一切错误。它往往和两种环境有关：对错误的低容错率、对绝对正确的控制。 6. 过度担心 = 透支痛苦 来自「阿楠的进化日记」的视频：过度担心和预演恐惧根本不是在预测未来，而是在透支痛苦。远虑是规划，过度担心是内耗。 7. 在意他人眼光 / 自我客体化 来自「槛外人philosophy」和「范不慌」的视频：和人打交道紧张，是因为把注意力放在“对方怎么看我”上（自我客体化），认知资源被分散；当自我认知与他人评价冲突时，会产生强烈焦虑（认知失调）。 8. 选择带来的自由眩晕 来自「无用之学」的视频：焦虑是自由带来的眩晕。选择困难本质上是站在十字路口时的眩晕感，但正是这种犹豫和焦虑，证明你不是被命运推着走。 综合来看，收藏中的共识是：焦虑多源于对不确定性和失败的恐惧、灾难化/预期性思维、追求完美最优解、过度在意他人评价，以及把未来的痛苦提前透支到当下。
