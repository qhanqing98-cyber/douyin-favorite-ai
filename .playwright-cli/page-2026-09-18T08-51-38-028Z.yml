              - generic [ref=f2e294]:
                - text: "### 概要 本视频围绕智能体在生产环境中“何时停止”的核心问题展开，指出翻车主因并非能力不足，而是缺乏精准的停止判断。内容首先解释了ReAct循环中“推理-执行-反馈”的咬合机制，强调工具结果必须写回上下文以驱动下一步决策。随后，视频提出了工程落地必备的三层停止机制，并重点区分了“停止运行”与“任务成功”的差异，最后强调了在强制中断时保留中间有效数据的重要性，以支持断点恢复。 ### 关键要点 - **ReAct循环本质**：推理与执行交替进行，工具返回的真实结果必须原封不动写回上下文，作为模型下一步决策的新证据。 - **三大停止机制**： - **成功停止**：任务完成且结果符合预期，正常结束。 - **保护性停止**：为防止资源耗尽，设定单次任务时间上限、最大循环轮数或成本预算，强制终止。 - **阻塞停止**：检测到无意义重复（如连续相同报错）或关键信息缺失时，系统强行打断，避免原地打转。 - **工程边界**：停止运行不等于任务成功。循环结束时需为最终状态打上明确标签（成功、失败、缺条件、被阻塞），不能直接将最后输出当作结果。 - **数据保留**：系统强制终止时，必须保留模型已获得的有效中间证据，写入最终状态，以便业务端获取部分进展或后续断点续跑。"
