                - text: "## 概要 1. 视频围绕字节等大厂在Agent和RAG方向的8道面试原题展开，作者逐题拆解，覆盖从基础原理到系统架构的完整技术栈。 2. 内容按“基础原理层（前3题）—工程落地层（中间3题）—系统架构层（最后2题）”递进设计，帮助面试者建立从原理到实战的完整认知。 3. 作者强调面试中不能只讲玩具demo，要能讲清底层机制（如工具调用本质是JSON输出）、工程细节（如token管理、RAG链路）以及架构视野（如多Agent协作）。 4. 视频最后总结，若能顺着这套逻辑清晰作答，面试官会认可候选人“不是只会调包，是真的懂”。 ## 关键要点 - **Agent调工具的本质**：模型输出结构化JSON（function call），框架解析并执行，结果回填上下文后二次推理生成回答。 - **工具调用的四种扩展流派**：ReAct模式（思考-行动-观察循环）、Plan-and-Execute（先规划后执行）、代码解释器模式（生成Python代码沙箱运行）、MCP协议（统一工具接入标准）。 - **模型判断是否调工具的三个因素**：system prompt引导、tool_choice参数（auto/required/none）、训练数据中工具调用样本的分布比例。 - **Token爆掉的四层解决方案**：滑动窗口截断（注意语义边界）、摘要压缩历史、向量数据库检索式加载、选用长上下文模型（需注意lost in the middle问题）。 - **RAG全链路标准流程**：文档解析→分块（固定/语义/递归，需块间重叠）→Embedding编码→向量库存储→在线检索TopK→Cross Encoder重排→带引用生成回答。 - **向量检索核心技术**：HNSW分层图近邻搜索（对数级复杂度）、IVF聚类加速、余弦相似度计算；数据库选型：Milvus（企业级）、Qdrant（轻量高性能）、Chroma（原型）、PgVector（已有PostgreSQL时）。 - **Agent记忆三层架构**：工作记忆（当前上下文窗口，类比RAM）、短期记忆（近期多轮对话，存向量库+元数据索引）、长期记忆（用户偏好/关键事件，持久化存储）；可提MemGPT的类操作系统管理思路。 - **多Agent协作三种模式**：层级式（Supervisor拆解任务）、对话式（Agent互发消息，如AutoGen）、共享黑板式（读写共享状态空间）；任务状态用JSON/Schema表示，单机内存/分布式Redis/持久化数据库存储，需考虑并发控制、失败重试、降级策略，实际有效Agent数量控制在3-5个。"
