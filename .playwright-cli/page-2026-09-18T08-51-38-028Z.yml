              - generic [ref=f2e662]:
                - text: "### 概要 这份转写内容主要解释了Agent规则文档（即系统提示词）的核心作用与编写方法。作者指出，规则文档本质上是一段长期、高权重的提示词，能在长任务中持续影响Agent的每一步决策，防止其“乱干”。内容强调，不应直接复制他人（如高Star仓库）的规则，而应基于自身工作流程定制。作者提供了编写规则的关键经验：用具体动作代替抽象价值观，并建议规则应从实际协作中反复出现的问题中逐步“生长”出来。最后，视频预告了下一期将讨论项目级规则与子目录规则及其冲突问题。 ### 关键要点 - **规则文档的本质**：它是附加给Agent的一段长期、高权重的提示词，每次交互都会生效，用于持续调教其工作方式。 - **重要性原因**：Agent执行复杂任务时会进行数十次自主判断，规则文档能确保这些判断符合用户的初始预期。 - **编写核心原则**： - 不要直接复制他人的规则，应针对自身工作流程定制。 - 避免写抽象价值观（如“设计要高级”），应写具体动作（如“优先参考知识库中的划分和构图”）。 - 规则应来源于实际协作中反复出现的问题，而非凭空想象或一次性抄录。 - **注意事项**：规则文档不宜过长（如Codex有截断机制），且需注意不同层级规则可能产生冲突。"
                - button "复制概要" [ref=f2e663] [cursor=pointer]
              - generic [ref=f2e664]: 这GitHub公开仓库20万star超过了OpenCode端身汉全占排名第24位但你点进去会发现它最核心的东西其实就是一份规则文道四段话为什么这么简单的一份东西会有这么多人认可因为很多人真正开始用Agent的后发现模型决定它能不能干规则决定它会不会乱干今天我们就来说清楚规则文道到底是什么它为什么对Agent的这么重要以及你自己的规则文道到底应该怎么写欢迎来到桌子频道说白了规则文道就是一段给Agent的提示词举个例子我说你是猪Agent的就会跟我哼哼鸡鸡我现在把规则文道改成你是猪再问它你是谁它就直接开始哼哼鸡鸡了每次你给Agent的发消息时它会额外读到一段你事先写好的内容只是这段内容不会显示在你的聊天框里这就是规则文道那为什么这段提示词对Agent的特别重要呢因为这是人机�的第一你给Agent的一个任务他会自己连续做很多次决定比如我跟他说你帮我把这份内容做成一期视频接下来他可能自己决定先查什么资料哪些内容要保留哪些删掉掉哪个工具做做完以后要不要继续修改等等一个任务背后可能就是十几次甚至几十次这样的判断这个时候你在最开始交代的那一段提示词就会一路影响它后面每一次怎么选你可能会想那我每次开始任务之前直接跟他说一遍不就行了吗确实短的任务是没有区别的区别在厂任务大家都知道上下文厂了模型注意力就会被袭示就容易DU3拉斯的干活开始抽分主流Agent的对规则文档做了特殊设计让它不同于普通提示词它是一段长期提示词而且它权重很高可以说规则文档是靠近系统提示词地位的持久提示词这就是产品官方专门留给用户的一个长期调教Agent的工作方式的入口官方只负责把Agent的产品设计得适合大多数人规则文档这个口子可以让Agent更适合你自己我们首先找到规则文档在哪里最简单的方式就是直接问你的Agent各家的教法可能不同但肯定是MD文档你可以直接打开MD文档来编辑或者让Agent来帮你写那现在问题来了前面这个公开仓库已经20万次大了是不是直接把它复制进去就完事了我的建议是任何人的规则都不要直接超过来规则文档的关键是规则必须适合你自己有一些原则当然非常通用比如说我现在规则里就写了一句用中文大白话回答我但是其他的就要针对自己的工作来设计你可能拿Agent的做视频做设计还有人可能拿Agent的做运营数据分析每个人遇到的情况都不一样规则这个东西是越贴合你自己的协作方式越有价值这里我给出一些我的经验坏规则写价值观好规则写动作你让Agent的自己总结写规则的时候可以把这两句话发给他这是啥意思呢比如说设计要高级要有审美这话肯定是没错的但都是批划这种就不要写人规则了好的规则应该写成做设计是优先参考知识库里已有的划分和构图这其实跟上班也一样如果一个领导天天跟你说要有责任性要努力要奋动你人应该也是晕晕的你应该做好Agent的好领导知道怎么写以后还有一个特别容易踩的坑很多人第一次打开规则文档恨不得直接写100条且不说像Codex这种有规则文档过场会直接截断的机制主要是规则文档不要贫空想象或者去抄应该让它慢慢长出来第一次Agent没有按你的想法来你纠正它第二次第三次出现同一种情况这个时候就可以开始考虑是不是应该把它写进规则了它就从你真正协作反复出现的问题里长出来了这样用的越久Agent才会越顺手这期我们说的主要还是全聚规则文档但真正进入项目以后还有项目籍规则子目录规则而且不同层级之间甚至可能出现规则冲突这期我们留到下一期Agent的工作编辑
