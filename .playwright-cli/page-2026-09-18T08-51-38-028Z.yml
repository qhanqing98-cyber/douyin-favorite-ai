                - text: "### 概要 1. 视频澄清了“RAG已过时，LLM Wiki才是新趋势”的流行说法，系统对比了两种技术的核心差异。 2. 传统RAG在提问时临时检索文档片段，知识无法沉淀；而LLM Wiki（由Andrey Carphey提出）在文档录入时就由大模型深度阅读、总结并构建持久互联的知识图谱。 3. 视频详细对比了两者在知识处理时机、信息组织形态、处理新知识方式和人类可读性上的区别，并介绍了LLM Wiki的三层架构（原始素材层、维基展现层、模式约定层）及两步运行机制（分析、生成）。 4. 最后指出LLM Wiki特别适合团队内部知识库和复杂情报矛盾分析两大场景，能持续沉淀知识并清晰标注信息冲突。 ### 关键要点 - **核心差异**：RAG是“提问时临时组装、即用即抛”；LLM Wiki是“录入时持续编译、知识持久沉淀” - **信息形态**：RAG处理碎片化向量数据块；LLM Wiki生成结构化交叉链接的页面和知识图谱 - **新知识处理**：RAG仅切块入库无交互；LLM Wiki主动阅读、更新旧页面、创建新概念并标记冲突 - **人类可读性**：RAG输出向量/切片不可读；LLM Wiki输出标准网页/笔记形式，阅读体验佳 - **三层架构**：原始素材层（不可修改的事实来源）、维基展现层（大模型生成的页面目录）、模式约定层（提示词和配置文件） - **两步运行机制**：分析阶段（提取观点、扫描现有库）→ 生成阶段（创建/更新页面、添加关联标签、标注冲突） - **适用场景**：团队内部知识库（自动转化聊天/会议记录）和复杂情报矛盾分析（清晰标注不同来源的数据出入）"
