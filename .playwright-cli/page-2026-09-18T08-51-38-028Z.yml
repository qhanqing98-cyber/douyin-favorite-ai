              - generic [ref=f2e296]: 智能体在生产环境里最容易翻车的环节不是它不够聪明而是它不知道什么时候该停停早了 任务是个半成品停晚了 它会在同一个错误上反复循环把你的token消耗殆尽一个真正可靠的agent系统它的核心其实是精准判断当前有没有进展风险有没有越界以及目标到底有没有真正完成我是小哲今天我们来看看在实际工程里怎么给智能体套上靠谱的刹车要理解怎么让智能体停下来我们得先理清它是怎么跑起来的大模型里经常提到的react循环本质上是推理和执行的咬合模型先做一个决策接着外部环境去执行对应的工具然后最关键的一步来了系统必须把工具返回的真实结果原封不动地写回到上下文里让模型根据新增加的证据去决定下一步该干什么咱们用查数据的场景举个例子比如你让智能体去查上个月的销售报表它第一步调用了数据库查询工具结果工具返回说这张表不存在这个时候如果系统是健康的它会去查总目录或者换个维度的接口去试行动结果在动态改变下一步的判断这就是一个正常的反馈循环但是在这个循环里如果没有外力干预智能体很容易钻牛角尖所以我们在工程落地的时候至少要给它加上三层停止机制第一层最符合直觉就是验收通过的成功停止任务完成了拿到了预期结果那就正常结束但在真实场景里很多任务是没有完美结果的这就需要第二层保护性停止有时候你要找的数据根本就不存在或者任务本身太复杂模型就会在里面尝试各种工具组合如果你不给它设定单次任务的时间上线最大循环轮数或者成本预算它真能跑到底层资源耗尽加上这层限制核心是为了保护你的系统和钱包还有第三层也是很多出版架构容易漏掉的叫做组色停止这是针对智能体其实已经卡死的情况举个例子模型想要读取某个内部文件但系统发现当前用户没有授权或者它连续试了五次同一个工具每次拿到的都是完全相同的爆错代码这种时候上下文中没有增加任何新的有效信息再循环一万次也是在原地打转只要检测到这种无意义的重复或者关键信息缺失系统必须马上强行打断它触发组色停止机制定好了接下来我们说说这里面的一条工程边界你必须在代码逻辑里明确一点停止运行并不等于任务成功当一个智能体不再调用工具的时候情况有很多种可能是它产生了幻觉自己骗自己说已经搞定了也可能是刚才提到的触发了最大轮数被系统强行掐断了系统只是不让它继续往下走并不代表它交出了一份合格的答卷所以当循环结束时我们不能直接把最后那句话甩给用户你得给它的最终状态打上明确的标签这次停止到底是成功是失败是缺条件需要用户补充还是碰到了死胡同被系统组色了更重要的一点是当系统强制终止这个循环的时候千万要把模型最后拿到手的有效证据保留下来假如它因为达到了调用次数上限被保护性停止了但它在停下来之前其实已经查到了部分有用的销售数据这些中间结果必须写进最终状态里这样的话即便任务中断了业务端还能拿到一些有价值的进展或者等后续条件补齐了模型可以读取这个断点继续干活而不是每次都像失忆了一样从头再来一个能在生产环境里长期跑下去的智能体一定不是蒙着眼睛死磕到底它走出的每一步都要清楚自己为什么继续凭什么停下以及中断之后还能不能带着现有的资产恢复过来本期视频就讲到这里我们下期再见掰了个半
