              - generic [ref=f2e233]:
                - text: "### 视频概要 1. 视频核心观点：成年人的社交关系变坏，往往不是因为做错了事，而是因为“展示错了东西”——在不同生态位（向上、同层、向下）的人面前，需要管理自己的呈现方式，避免无意中引发他人的嫉妒或不适。 2. 理论依据：引用心理学家费斯廷格的社会比较理论，说明人会本能地与身边人比较；嫉妒很少承认自己是嫉妒，常伪装成“判断力”（如“他也没多厉害”“他现在怎么这么装”）。 3. 核心建议：向上（领导/客户）不要展现“松弛”，要展现对风险的重视和靠谱；同层（同事/朋友）不要“表演努力”，避免用过程压迫他人；向下（资源/处境不如己者）不要流露“优越感”，尤其慎用“才”字（如“才一千多”）。 4. 本质总结：成熟不是让所有人喜欢你，而是懂得在不同关系里管理别人的“威胁感”——对上给安全感，对同层给松弛感，对暂时不如你的人给体面感；这不是虚伪，而是分寸。 ### 关键要点 - **向上相处**：少说“问题不大”“随便搞搞”，换成“我有把握，但我也看了两个风险点”“我准备了一个备选方案”——意思相近，但给对方的是“靠谱”而非“轻飘”。 - **同层相处**：不晒凌晨、不喊辛苦、不拿努力压人；结果未出前少讲过程，结果出来后也别用过程审判别人；被问是否准备很久，可说“提前看了一点”。 - **向下相处**：慎用“才”字（如“才两千”），能说体验就别说价格，能说“适合自己”就别说“这个不贵”；避免让对方因你的好而觉得自己差。 - **关系断裂真相**：很多关系不是大吵断的，而是某个瞬间对方觉得“跟你在一起不舒服”，然后逐渐疏远——这常源于你无意中展示的“松弛”“努力”或“优越”。"
