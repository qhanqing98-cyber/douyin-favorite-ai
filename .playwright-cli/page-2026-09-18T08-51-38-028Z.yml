              - generic [ref=f2e256]: 一起来看看自己的Agent和RAG面试题看看你能达上来几道其实面试题翻来覆去就那几个但是千万别拿玩具demo去糊弄面试官我是宏玉点赞收藏加关注我们马上开始宇宙场的Agent和Red面试这八道题你能达出来多少道今天咱们就用几分钟把这八道题从头到尾给你扒一遍别眨眼信息量很大来面试开始好第一题Agent到底怎么调工具你可能觉得它很玄乎说白了就三个字结构化模型不是在那里瞎想我要不要调工具它是在输出一段json就是那种有花扩号有字段名的结构化数据整个流程是这样的你的问题发过去模型一看A 这个我得调个天气接口它就生成一个function call里面写着我要调哪个函数参数是什么然后框架拿到这个json真的去调哪个函数把结果拿回来拿回来的结果呢再拼回到对话上下文里模型二次推理最后给你一句人话所以你看到的A 整调工具底层本质上就是模型输出json框架解析之行结果回田在生成拆开来看就这一点事好 第二题除了标准的方声考领还有什么调用姿势这个东西现在演化出好几套流派了你的心里有数第一个react模式全称是reasoning加acting模型先想一步我得查天气然后去调工具拿到结果再想一步我还得查防属知识再调再拿结果最后综合回答它是一种思考行动观察循环推理的模式第二个plan and execute规划和执行分开模型先把整个计划列好第一步干啥第二步干啥第三步干啥然后一步一步执行好处是全局规划能力强不容易跑偏第三个代码解释器模式这个更猛模型直接生成python代码在沙箱里跑工具调用的终极形态其实就是图灵完备的代码执行你能写出来的它都能干第四个最近比较火的mcp协议anthropec提的一个标准相当于给ai的工具接入搞了一套usb协议所有工具都按这个标准来对接不用每次单独适配这四种你得知道面试官一问你就啪啪啪全列出来好第三题模型到底怎么判断要不要调工具这个问题很多人会答片你要记住一句话它不是在判断它是训练出来的本能模型没有搞一个二分类器在那边判断说我要调工具了还是我不要调工具它就是在做自回归的下一个token预测它只是恰好在看到某些输入模式的时候倾向于输出一个代表开始调工具的token什么影响这个倾向呢三个东西第一system prompt引导你的提示词里写了你可以调用工具这个描述本身就能大幅提高调用概率第二to choice参数你设成auto它自己看着办你设成required它必须调你设成num打死不调这个是硬开关第三也是很多人忽略的一点训练数据的分布训练的时候有多少比例的样本走了工具调用路线模型推理的时候就天然的有多大概率往那条路走所以把这三条讲出来面试官就知道你是真懂原理不是被免惊的好第四题特别实战的一道题token爆了咋办这个问题从四个层次来回答第一层滑动窗口阶段最直接的保留最近恩论对话或者保留第一条系统指令加上最新恩论老的直接丢掉但要注意按语异边界截别把一句话切两半第二层摘药压缩长对话历史拿模型给它压成一段摘药用户之前问了天气和股票用这几百个token代替原来好几千个token的原始对话第三层检索是家载所有的历史对话存到相量数据库里当前问题来了做一次检索只把最相关的几条历史记录塞进上下文不相关的就不占空间了第四层选大窗口模型现在也有能支持100k200k上下文的模型了但是注意你要补一句支持长上下文不等于能有效利用长上下文大多数模型超过32k之后注意力衰减非常明显中间的信息很容易丢失这叫lost in the middle问题四层递进从简单粗暴到惊喜优雅基本就覆盖全了好第五题reg 全链路怎么跑这道题考官想看你有没有真的达过一套能上生产的reg系统整个链路是这样的离线阶段文档来了先做解析PDFHTMLMarkdown各自有各自的解析方式然后分块这里面有很多讲究固定长度分块语异分块地规分块还要摄块间重叠防止关键信息卡在边界上被切断了分完块之后过Inbiting模型编码成箱量存到箱量数据库里在线阶段用户问题来了先做预处理然后同样过Inbiting模型编码用这个箱量到箱量库里做相思度检索取TopK但这还不够箱量相思度不等于语异相关性所以后面还要加一层重拍序拿Cross Encoder精排一遍把真正相关的筛出来最后把检索到的内容加上引用和问题一起为给大模型生成回答这是一个完整的标准链路你如果还能提一句H,Y,D,E多录照回这些东西就更显得你有深度了好第六题接着追问箱量检索到底怎么做的不会就是用similarity search那么简单吧核心是近思最近零搜索因为暴力计算在大规模场景下根本不可行第一个要讲的算法H&SW这是目前最主流的它是构建一个分层的图结构上层节点吸收用来快速跳跃到目标区域下层节点绸密做惊喜匹配查询的时候从最上层开始贪婪搜索一层层往下走时间复杂度对数级别照回率能做到95%以上第二个IVF先拿Kmins巨类查询的时候只搜索最近的几个巨类中心不用扫全量适合一级规模的场景通常会配橡量量化做压缩另外你还得知道相似度怎么算文本场景下主流用的是鱼咸相似度最后面试官可能还会问数据库选行你可以提一提Milvus适合企业级生产Q转轻量高性能Chroma适合圆形开发PgVector如果你已经有PulseGrass口基础设施就非常方便这几个点说出来对方就知道你不是只会调个接口的人好 第七题开始进入架构层面了Agent记忆怎么管这个东西是Agent从Demo走向Production的核心平静你得讲出层次感记忆分三层参照人类认知来设计的第一层 工作记忆就是当前的上下文窗口当前这次对话当前这个任务的状态中间结果生命周期就是单词回化容量就是模型的上下文窗口它有点像电脑的RAM第二层 短期记忆近期的多轮对话历史上次任务留下的上下文生命周期是多次回化天道周级别存在相量数据库加上原数据所引每次新对话开始的时候检索相关的部分塞进去第三层 长期记忆用户的偏好 习惯关键事件 决策历史这个是持久化的越到年级别存在结构化数据库加上相量库这里面还有一个很前沿的概念可以提一下MGPT提出的类操作系统管理把上下文窗口当RAM相量库当SSD当RAM不够了把不活跃的内容换到SSD需要的时候再加载回来这个思路非常巧妙面试官听了会眼前一亮好 最后一题也是最考验架构能力的一题多个agent的协作的时候上下文怎么传任务状态怎么同步先讲协作的三种主流模式第一种 层级式上面有个supervisor同管全局把任务拆了分配给下面的紫agent紫agent只接收跟自己相关的紫任务和必要上下文supervisor持有全局试图第二种 对话是agent之间互相发消息就像人类团队开会一样auto-gen就是这个模式的典型代表每个agent维护自己的对话历史只处理发给自己的消息第三种 共享状态式也叫黑板模式所有agent读写同一个共享状态空间适合数据流清晰的场景然后是任务状态管理状态怎么表示呢通常就是一个Jason对象或者结构化的Skima包含任务ID 进度当前阶段 产出物的引用状态存在哪儿呢单击就用内存分布式就用Redis需要持久化就上数据库状态流转可以用有限状态机来建模还有并发控制 失败重视降级策略这些都是要考虑到的问题另外你还得知道现实中的一个核心挑战agent多了不一定好上下文会迅速膨胀错误会集连传播通信开销也会增加实际有效的agent数量通常控制在3到5个好 最后咱们来回顾一下这8道题的递进结构你就能看出这套面试题设计得有多巧妙了第一层基础原理层前3道题工具调用机制调用饭式扩展模型决策原理考察的是你对agent底层运作的理解深度你能不能讲清楚Jason是怎么出来的模型内部到底发生了什么第二层工程落地层中间3道题token管理reg全链路 项量检索考察的是你有没有真正搭过系统知不知道各环界的坑在哪儿能不能从零大一套生产可用的东西第三层系统架构层最后两道题记忆管理和多agent协作考察的是你驾驭复杂系统的能力你有没有从demo走向产品的视野能不能处理状态传递一致性故障隔离这些问题从原理到工程 再到架构从单agent到多agent这8道题基本把agent和reg方向的技术战全给你覆盖了你要是能顺着这个结构一路打下来面试官基本上心理就有数了这个人不是只会吊包 是真的懂好 今天就讲到这里 回去好好消化一下面试的时候 别紧张把这套逻辑讲清楚 问题不大
