              - generic [ref=f2e235]: 向上不要展示松弛同层不要展示努力向下不要展示优越听起来很虚伪但这是成年人世界里不成文的人性规律很多关系变坏不是因为你做错了而是因为你展示错了东西你以为是自信别人听成清曼你以为是自律别人听成炫耀你以为是分享别人听成优越更扎心的是很多时候你真的没骂人没炫耀没针对谁甚至你还觉得自己挺真诚可不知道从哪天开始有人开始疏远你阴阳你背后说你变了你想不明白我到底做错什么了更残酷的答案是你可能真的没做错事但你让别人觉得他在你面前变差了人和人相处别人看到的从来不是完整的你而是你呈现出来的那个你心理学家费斯廷格在1954年提出过社会比较理论简单说人会本能的拿自己和身边人比较你比他差他可能同情你你和他差不多他会观察你你一旦超过他他就开始解释你而嫉妒最麻烦的地方在于他很少承认自己是嫉妒他不会说我酸了他会说他也没多厉害他不会说我被刺激到了他会说他现在怎么这么装你看嫉妒不会承认自己是嫉妒他会伪装成判断力所以真正成熟的人不是让所有人都喜欢你而是懂得在不同关系里管理别人的威胁感第一向上不要展示不在乎是松弛很多人以为在领导客户假方面前表现的云淡风轻是一种高级感但你以为的稳定在对方眼里可能是没当回事比如领导问你这个项目把握怎么样你说放心吧小问题你觉得自己很自信但领导听到的可能是你轻敌因为上位者最怕的不是你能力不够而是你对风险没感觉他要的不是你的潇洒是他的安全感所以向上表达尽量少说问题不大随便搞搞这个很简单你可以换成我有把握但我也看了两个风险点方向是稳的不过我准备了一个备选方案这个事能推进但有个环节我会重点叮一下你看意思差不多但感觉完全不一样前一种叫轻飘飘后一种叫靠谱向上相处你可以内心松弛但外在一定要让对方看到你的重视第二同层不要展示表演是努力这一条最多人才同事同学同行朋友之间最敏感的不是你比他强而是你一边变强一边让他觉得自己很废比如大家都在准备晋升有人天天在群里发又学到凌晨两点连续二十天早起周末又没休息大家也要卷起来他以为自己在分享自律别人感受到的可能是被审判你每说一次我只睡了四个小时别人听到的可能不是佩服而是所以我睡七个小时就是不配赢吗还有一种更扎心的场景考试前面试前有人说哎呀我都没怎么准备结果最后他第一这句话杀伤力很强因为别人会觉得我拼死拼活还不如你随便搞搞你本来只是想显得轻松别人却觉得你在反耳塞所以同层之间不是不能努力而是不要把努力展示成一种压迫努力一旦被反复展示就不只是努力了他会变成隐形比较你赢了别人说你爱表现你输了别人心里可能还松一口气卷成这样也没赢真正聪明的人不晒凌晨不喊辛苦不拿努力压人结果没出来之前少讲过程结果出来之后也别用过程审判别人别人问你你是不是准备很久你可以说提前看了一点这不是虚伪而是不给别人制造压迫感努力是你的底牌不是你拿来压别人的道具第三向下不要展示无意识的优越这里的向下不是看不起谁而是指资源收入信息处境暂时不如你的人这一条最隐蔽也最容易伤人因为很多人不是故意炫耀他是真的觉得自己在分享朋友看重一件三百块的外套犹豫了半天你随口一句这个面料一般吧我上次买了件差不多的也就贵两千你觉得自己在提建议但对方听到的可能是我认真挑了半天的东西在你那里不值一提还有一个字特别危险叫财这顿饭才一千多这个酒店才两千一万这个包我买的时候才一万出头你说财是因为这个数字对你很轻可对别人来说他可能很重你的一句财刚好砸在别人的自尊上很多关系不是突然断的而是每见你一次对方都要重新确认一次自己的差距一次不舒服他忍了两次不舒服他笑笑次数多了他就在心里说算了以后少见吧所以和处境暂时不如你的人相处最重要的不是展示你过得多好而是别让别人因为你的好觉得自己很差别人问你东西怎么样你可以说挺好用的性价比还行你能说体验就别说价格能说适合自己就别说这个不贵社会学家哥夫曼在日常生活中的自我呈现理讲过人和人相处其实都在管理自己呈现给别人的样子这不是虚伪这是分寸有人可能会说那做人也太累了吧我过得好还不能说了当然能说但你要知道你有表达的自由别人也有远离你的自由很多成年人的关系断裂不是大吵一架而是某个瞬间对方突然觉得跟你在一起我不舒服然后他不再约你不再回你消息不再把机会介绍给你也不再在关键时刻替你说话你还以为是人情冷暖其实可能是你一直没有管理好自己的疯狂真正成熟的人不是把自己变弱而是知道自己的强什么时候该亮出来什么时候该收起来对上给安全感对同层给松弛感对暂时不如你的人给体面感疯狂是留给战场的不是拿来扎身边人的你最受不了哪一种人是说话轻飘飘的人是天天晒努力的人还是满嘴财也就的人评论区说说我是无限重塑的亲和关注我每天5分钟聊一点对女生真正有用的事
