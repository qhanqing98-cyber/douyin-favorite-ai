                - text: "### 概要 这段视频内容围绕AI大模型面试中关于RAG（检索增强生成）召回率优化的高频问题展开。面试官通过一个具体的业务场景（对比两家公司季度营收差异）来考察候选人是否真正理解传统RAG的缺陷，以及GraphRAG、HyDE、多跳检索这三种进阶方案的适用场景与底层逻辑。视频指出，多数候选人只会堆砌技术名词，缺乏对问题本质的拆解能力，最终给出了一个分四步的完整解题框架。 ### 关键要点 - **传统RAG召回率低的本质**：核心缺陷只有两个——“无逻辑”（无法识别实体关系与推理）和“无关联”（仅文本相似度匹配，无法处理多实体联动与问句语异偏差）。 - **HyDE（假设性文档增强）**：低成本提升召回的最优解。核心是用LLM生成虚拟标准答案再检索，修正语异偏差；优点是落地成本极低，缺点是**无推理与实体关联能力**，适用于通用知识库、口语化提问等简单场景。 - **多跳检索**：解决递进式、多层级查询问题。核心是将复杂问题拆解为多轮子问题，逐步补充缺失信息；缺点是延迟高、易累积误差，适用于信息分散需跨文档整合的场景。 - **GraphRAG（知识图谱增强）**：解决逻辑与实体关联的终极方案。核心是构建实体关系图谱，支持关系推理与溯源；优点是召回精度天花板最高，缺点是落地成本极高，适用于金融、医疗、法律等强逻辑专业场景。 - **场景选型结论**：简单语异匹配问题优先用HyDE；跨公司营收对比这类需要实体关联与逻辑推理的场景，应选用GraphRAG，而HyDE和多跳检索因缺乏实体关联能力或效率不足而不适用。"
