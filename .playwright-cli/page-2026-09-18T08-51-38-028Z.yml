              - 'heading "Agent 规则文档怎么写？它如何影响长任务里的每一步判断 高Star的Agent规则可以参考，整份复制很容易带进无关要求和冲突。真正该写的是自己使用过程中反复出现的工作问题，以及下一步动作和验收方法。 #Agent #AI工具 #Codex #AI工作流 #AI教程" [level=3] [ref=f2e649]'
