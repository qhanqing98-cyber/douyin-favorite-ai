              - generic [ref=f2e641]:
                - text: "### 概要 这段视频主要讲解了小说创作中“鸿沟”（Gap）这一核心概念，源自罗伯特·麦基的编剧理论。视频指出，许多小说读起来像流水账，是因为故事中缺乏“鸿沟”，即期望与现实之间的裂缝。作者通过对比案例，详细拆解了构建“鸿沟”的四个步骤，并解释了为何AI写作容易产生流水账，最后鼓励创作者在作品中使用这一技巧。 ### 关键要点 - **“鸿沟”的定义**：期望与现实之间的裂缝，是故事的材质，能打破读者的预测，产生戏剧张力。 - **流水账的本质**：主角的每个行动都得到符合预期的世界回应，导致读者大脑进入低唤醒状态。 - **构建“鸿沟”的四个步骤**： - 主角有清晰欲望，并采取最小保守行动。 - 世界给出完全相反的反应，打破主角预期。 - 主角被迫调整策略，采取更大风险的行动。 - 新行动挖出更深的新鸿沟，循环往复，推动故事发展。 - **AI写作的局限**：大语言模型的训练目标是给出符合预期的回应，因此容易生成流水账，难以自然产生“鸿沟”。"
